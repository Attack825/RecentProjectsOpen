repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.6
  hooks:
  - id: ruff-check
    types_or: [ python, pyi ]
    # 添加更多参数增强检查
    args: [ --fix, --show-fixes, --exit-non-zero-on-fix ]

  - id: ruff-format
    types_or: [ python, pyi ]
    # 显示格式化的文件列表
    args: [ --verbose ]
