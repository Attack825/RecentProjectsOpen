# yaml-language-server: $schema=https://www.flowlauncher.com/schemas/settings-template.schema.json
body:
  - type: textarea
    attributes:
      name: program_path
      label: Program Path
      description: >
        Configure application paths in the following format:
        
        APP_DOWNLOAD=C:/path/to/app.exe
        
        APP_STORAGE=C:/path/to/storage/file

        Each application needs both DOWNLOAD and STORAGE entries.
      defaultValue: ""
  - type: textarea
    attributes:
      name: acronyms_suggestions_list
      label: Acronyms Suggestions List
      description: >
        Configure the list of acronyms suggestions.

        It will be displayed when the plugin is activated.

        Each acronym should be defined on a new line.

        Keep empty to display the default acronyms suggestions.
  - type: input
    attributes:
      name: plugin_trigger_keyword
      label: Plugin Trigger Keyword
      description: >
        The keyword to trigger the plugin.

        If you change it, please update here as well.
      defaultValue: "r"


