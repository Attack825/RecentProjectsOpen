name: Publish Release

on:
  # 只有推送以 "v" 开头的 tag 时才触发工作流
  push:
    tags:
      - "v*"
  workflow_dispatch: # 保留手动触发选项

permissions:
  contents: write

jobs:
  build:
    # Flow Launcher 只支持 Windows，发布物必须在 Windows 上构建：
    # 这样 pip install -t lib 只会拿到纯 Python 包，不会再混入 Linux 的 .so。
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.prop }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t ./lib

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: "plugin.json"
          prop_path: "Version"

      - name: Stage package
        shell: pwsh
        run: |
          $staging = "staging"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item main.py, plugin.json, README.md, LICENSE, SettingsTemplate.yaml -Destination $staging
          Copy-Item icons, src, lib -Destination $staging -Recurse
          # 发布包必须是纯 Python：Flow 用户可能使用任意解释器/平台，二进制扩展不可移植
          $native = Get-ChildItem "$staging\lib" -Recurse -Include *.pyd, *.so
          if ($native) {
            throw "lib 中发现平台相关二进制：$($native.FullName -join ', ')"
          }
          Get-ChildItem $staging | Select-Object Name

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive -Path staging\* -DestinationPath RecentProjectsOpen.zip -Force
          Get-Item RecentProjectsOpen.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecentProjectsOpen
          path: RecentProjectsOpen.zip

  smoke:
    # 发布前用官方产物 + 干净解释器验证：stderr 必须为空、stdout 必须可解析
    needs: build
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: RecentProjectsOpen
          path: .

      - name: Smoke test packaged artifact
        env:
          PYTHONUTF8: "1"
        run: python tools/smoke_test.py RecentProjectsOpen.zip --python python

  publish:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: RecentProjectsOpen
          path: .

      - name: Publish
        uses: softprops/action-gh-release@v1
        with:
          files: "RecentProjectsOpen.zip"
          tag_name: "v${{ needs.build.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
